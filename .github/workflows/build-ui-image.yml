name: Build UI Image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build. Defaults to main."
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: build-ui-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: true

      - name: Compute tag
        id: tag
        run: echo "tag=prod-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ui/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dograh-ui:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=dograh-ui-amd64
          cache-to: type=gha,mode=max,scope=dograh-ui-amd64
